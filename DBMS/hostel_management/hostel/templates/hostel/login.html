{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body style="font-family: 'Arial', sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(to right, #ff7e5f, #feb47b);">

    <div style="width: 100%; max-width: 500px; margin: 50px auto; padding: 30px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center;">
        <h2 style="font-size: 2rem; color: #333; margin-bottom: 20px;">Login</h2>

        <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #4CAF50; color: white; font-size: 1.1rem; border: none; cursor: pointer; border-radius: 5px; padding: 12px; transition: background-color 0.3s ease;">Login</button>
        </form>

        <p style="font-size: 1rem;">Don't have an account? <a href="{% url 'register' %}" style="color: #4CAF50; text-decoration: none; font-size: 1rem;">Register here</a></p>
    </div>

    {% if error %}
        <script>
            alert("{{ error }}");
        </script>
    {% endif %}

</body>
</html>
